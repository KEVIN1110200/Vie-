<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Vie</title>
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#0b0909">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Vie">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-180.png">
<link rel="manifest" href="manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Jost:wght@300;400;500&family=JetBrains+Mono:wght@500&display=swap">
<style>html,body{margin:0;padding:0}[hidden]{display:none!important}img{max-width:100%}</style>
</head>
<body>
<style>
/* Layout : même format que le thème V Barber — écran d'accueil plein écran, en-tête avec onglets numérotés i. ii. iii.,
   panneaux plein écran qui défilent, cartes en arche, barre d'onglets en pilule en bas sur mobile. Palette : noir, bleu, violet. */
:root{
  /* Palette reprise du thème V Barber : noir, vin, or, crème */
  --ink:#0b0909; --ink-2:#141010; --deep:#5a0f1e; --violet:#5a0f1e; --violet-2:#7a1a2c;
  --blue:#cfae78; --line:#cfae78; --light:#e6cc9c; --cream:#f3ebe0; --ok:#46e0a0; --bad:#ff6b88; --warn:#ffc266;
  --serif:"Cormorant Garamond","Times New Roman",serif;
  --sans:"Jost","Helvetica Neue",Arial,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
  --header-h:92px;
  color-scheme:dark;
}
html,body{background:var(--ink);color:var(--cream);height:100%}
body{overflow:hidden}
.vb{position:fixed;inset:0;font-family:var(--sans);font-weight:300;-webkit-font-smoothing:antialiased;overflow:hidden;background:var(--ink);color:var(--cream)}
.vb *,.vb *::before,.vb *::after{box-sizing:border-box}
.vb button,.vb input,.vb select,.vb textarea{font:inherit;color:inherit}
.vb :focus-visible{outline:1px solid var(--light);outline-offset:3px}

/* Fond animé */
.vb-stage{position:absolute;inset:0;overflow:hidden;background:var(--ink)}
.vb-stage img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transform:scale(1.08);transition:opacity 1800ms ease,transform 9s linear}
.vb-stage img.is-active{opacity:1;transform:scale(1)}
.vb-tint{display:none;position:absolute;inset:0;pointer-events:none;background:linear-gradient(160deg,rgba(122,26,44,.22),rgba(122,26,44,.26));mix-blend-mode:color}
@media (prefers-reduced-motion:reduce){.vb-stage img{transition:opacity .4s linear;transform:none}}
.vb-shade{position:absolute;inset:0;pointer-events:none;transition:opacity 1200ms ease}
.vb-shade--intro{background:linear-gradient(180deg,rgba(11,9,9,0) 70%,rgba(11,9,9,.6) 100%)}
.vb:not(.vb--site) .vb-tint{opacity:0}
.vb-tint{transition:opacity 1200ms ease}
.vb-stage .vb-v{position:absolute;inset:0;opacity:0;transition:opacity 1800ms ease}
.vb-stage .vb-v.is-active{opacity:1}
.vb-stage .vb-v img{position:absolute;opacity:1;transition:transform 9s linear}
.vb-stage .vb-v .bg{inset:-10%;width:120%;height:120%;object-fit:cover;filter:blur(48px) saturate(1.2) brightness(.55);transform:scale(1.1)}
.vb-stage .vb-v .fg{inset:auto;left:50%;top:46%;width:auto;height:auto;max-width:min(78vw,520px);max-height:50vh;aspect-ratio:auto;object-fit:contain;transform:translate(-50%,-50%) scale(1.04);
  -webkit-mask-image:radial-gradient(ellipse 50% 50% at 50% 50%,#000 62%,transparent 100%);mask-image:radial-gradient(ellipse 50% 50% at 50% 50%,#000 62%,transparent 100%)}
.vb-stage .vb-v.is-active .fg{transform:translate(-50%,-50%) scale(1)}
.vb-stage .vb-v.is-active .bg{transform:scale(1.18)}
.vb-shade--site{opacity:0;background:linear-gradient(90deg,rgba(11,9,9,.93) 0%,rgba(11,9,9,.8) 40%,rgba(11,9,9,.4) 70%,rgba(11,9,9,.2) 100%),linear-gradient(180deg,rgba(11,9,9,.7) 0%,rgba(11,9,9,0) 22%)}
.vb--site .vb-shade--intro{opacity:0}
.vb--site .vb-shade--site{opacity:1}

/* Écran d'accueil */
.vb-intro{position:absolute;inset:0;z-index:20;display:flex;align-items:flex-end;justify-content:center;text-align:center;cursor:pointer;
  padding-top:24px;padding-bottom:calc(64px + env(safe-area-inset-bottom,0px));padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px));
  transition:opacity 900ms ease,visibility 0s linear 900ms}
.vb--site .vb-intro{opacity:0;visibility:hidden;pointer-events:none}
.vb-intro__inner{width:100%;max-width:620px}
.vb-intro__kicker{font-family:var(--serif);font-style:italic;font-size:clamp(20px,2.4vw,28px);color:var(--light);animation:vb-rise 1.2s .3s cubic-bezier(.2,.7,.2,1) both}
.vb-intro__brand{font-family:var(--serif);font-weight:500;font-size:clamp(56px,11vw,110px);line-height:.92;letter-spacing:.1em;text-transform:uppercase;margin:8px 0 0;color:var(--cream);text-shadow:0 4px 60px rgba(0,0,0,.45);animation:vb-rise 1.4s .55s cubic-bezier(.2,.7,.2,1) both}
.vb-intro__brand b{font-weight:600;background:linear-gradient(160deg,#f1dcb0,#cfae78);-webkit-background-clip:text;background-clip:text;color:transparent}
.vb-intro__rule{width:120px;height:1px;background:linear-gradient(90deg,var(--blue),var(--violet-2));margin:22px auto 18px;transform-origin:center;animation:vb-rule 1.2s 1.1s cubic-bezier(.2,.7,.2,1) both}
.vb-intro__tag{font-size:12px;letter-spacing:.3em;text-transform:uppercase;margin:0 0 14px;animation:vb-rise 1.2s 1.3s cubic-bezier(.2,.7,.2,1) both;text-wrap:balance}
.vb-intro__words{font-family:var(--serif);font-style:italic;font-size:19px;color:var(--light);margin:0 0 26px;animation:vb-rise 1.2s 1.45s cubic-bezier(.2,.7,.2,1) both;text-wrap:balance}
.vb-intro__cta{animation:vb-rise 1.2s .6s cubic-bezier(.2,.7,.2,1) both;display:flex;flex-direction:column;align-items:center;gap:18px}
.vb-intro__cta .vb-btn{min-width:260px}
.vb-intro__links{font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:rgba(243,235,224,.7)}
.vb-intro__dots{position:absolute;left:0;right:0;bottom:calc(28px + env(safe-area-inset-bottom,0px));display:flex;gap:6px;justify-content:center}
.vb-intro__dots span{width:14px;height:1px;background:rgba(243,235,224,.3);position:relative;overflow:hidden}
.vb-intro__dots span.is-active::after{content:"";position:absolute;inset:0;background:var(--line);animation:vb-progress 3000ms linear forwards;transform-origin:left}
@keyframes vb-rise{from{opacity:0;transform:translateY(22px)}to{opacity:1;transform:none}}
@keyframes vb-rule{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes vb-progress{from{transform:scaleX(0)}to{transform:scaleX(1)}}

/* En-tête */
.vb-header{position:absolute;top:0;left:0;right:0;z-index:15;height:calc(var(--header-h) + env(safe-area-inset-top,0px));padding-top:env(safe-area-inset-top,0px);
  display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding-left:max(4vw,env(safe-area-inset-left,0px));padding-right:max(4vw,env(safe-area-inset-right,0px));
  opacity:0;transform:translateY(-14px);transition:opacity .9s .5s ease,transform .9s .5s cubic-bezier(.2,.7,.2,1);pointer-events:none}
.vb--site .vb-header{opacity:1;transform:none;pointer-events:auto}
.vb-logo{justify-self:start;font-family:var(--serif);font-weight:500;font-size:30px;letter-spacing:.14em;text-transform:uppercase;line-height:1;display:flex;align-items:baseline;gap:4px;background:none;border:0;cursor:pointer;padding:0}
.vb-logo{align-items:center;gap:12px}
.vb-logo__img{width:46px;height:46px;border-radius:12px;object-fit:cover;border:1px solid rgba(207,174,120,.5);box-shadow:0 8px 24px rgba(0,0,0,.5);flex:none}
.vb-intro__logo{display:block;width:clamp(96px,22vw,132px);height:auto;aspect-ratio:1;margin:0 auto 22px;border-radius:28px;object-fit:cover;border:1px solid rgba(230,204,156,.55);box-shadow:0 30px 80px rgba(0,0,0,.6),0 0 60px rgba(122,26,44,.35);animation:vb-rise 1.2s .1s cubic-bezier(.2,.7,.2,1) both}
.vb-logo b{font-weight:600;font-size:38px;background:linear-gradient(160deg,#f1dcb0,#cfae78);-webkit-background-clip:text;background-clip:text;color:transparent}
.vb-tabs{position:relative;display:flex;gap:2px}
.vb-tab{background:none;border:0;cursor:pointer;padding:14px 16px;display:flex;align-items:baseline;gap:8px;font-size:12px;letter-spacing:.24em;text-transform:uppercase;color:rgba(243,235,224,.6);transition:color .4s ease;white-space:nowrap}
.vb-tab span{font-family:var(--serif);font-style:italic;font-size:15px;letter-spacing:.02em;color:var(--line);opacity:.9}
.vb-tab .s{display:none}
.vb-tab:hover,.vb-tab[aria-selected="true"]{color:var(--cream)}
.vb-tabs__bar{position:absolute;bottom:4px;left:0;height:1px;width:0;background:linear-gradient(90deg,var(--blue),var(--violet-2));transition:transform .7s cubic-bezier(.65,0,.35,1),width .7s cubic-bezier(.65,0,.35,1)}
.vb-actions{justify-self:end;display:flex;gap:16px;align-items:center;font-size:11px;letter-spacing:.24em;text-transform:uppercase;color:rgba(243,235,224,.7)}
.vb-sync{display:flex;align-items:center;gap:8px}
.vb-sync i{width:6px;height:6px;border-radius:50%;background:rgba(243,235,224,.35)}
.vb-sync.on i{background:var(--ok);box-shadow:0 0 10px var(--ok)}

/* Panneaux */
.vb-panels{position:absolute;inset:0;z-index:10}
.vb:not(.vb--site) .vb-panels,.vb:not(.vb--site) .vb-panel{visibility:hidden!important;pointer-events:none}
.vb-panel{position:absolute;inset:0;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;
  padding-top:calc(var(--header-h) + env(safe-area-inset-top,0px) + 6vh);padding-bottom:12vh;
  padding-left:max(4vw,env(safe-area-inset-left,0px));padding-right:max(4vw,env(safe-area-inset-right,0px));
  visibility:hidden;pointer-events:none;scrollbar-width:thin;scrollbar-color:rgba(207,174,120,.4) transparent}
.vb-panel.is-active{visibility:visible;pointer-events:auto}
.vb-panel__content{max-width:720px}
.vb-panel--wide .vb-panel__content{max-width:1120px}
.vb-anim{opacity:0;transform:translateY(26px);filter:blur(4px);transition:opacity .5s ease,transform .5s ease,filter .5s ease}
.vb-panel.is-active .vb-anim{opacity:1;transform:none;filter:none;transition:opacity 1s cubic-bezier(.2,.7,.2,1),transform 1.1s cubic-bezier(.2,.7,.2,1),filter 1s ease;transition-delay:calc(250ms + var(--i,0)*90ms)}
.vb-kicker{display:flex;align-items:center;gap:16px;margin-bottom:26px;font-size:12px;letter-spacing:.36em;text-transform:uppercase;color:var(--line)}
.vb-kicker em{font-family:var(--serif);font-size:20px;letter-spacing:0}
.vb-kicker::after{content:"";width:60px;height:1px;background:var(--line);opacity:.7}
.vb-title{font-family:var(--serif);font-weight:400;font-size:clamp(44px,6.2vw,92px);line-height:.98;letter-spacing:-.005em;margin:0 0 28px;color:var(--cream);text-wrap:balance}
.vb-title em{display:block;font-style:italic;color:var(--light)}
.vb-lead{font-size:18px;line-height:1.7;max-width:540px;margin:0 0 34px;color:rgba(243,235,224,.88)}
.vb-h3{font-family:var(--serif);font-weight:500;font-size:clamp(30px,3.4vw,44px);line-height:1.05;margin:64px 0 18px}
.vb-h3 em{font-style:italic;color:var(--light)}
.vb-sub{font-size:11px;letter-spacing:.3em;text-transform:uppercase;color:rgba(243,235,224,.6);margin:-8px 0 20px}

/* Liste numérotée (format « étapes ») */
.vb-steps{list-style:none;margin:0 0 40px;padding:0;max-width:720px}
.vb-step{border-top:1px solid rgba(207,174,120,.25)}
.vb-step:last-child{border-bottom:1px solid rgba(207,174,120,.25)}
.vb-step>summary,.vb-step>.row{list-style:none;display:flex;align-items:baseline;gap:18px;padding:18px 0;cursor:pointer}
.vb-step>summary::-webkit-details-marker{display:none}
.vb-step .n{font-family:var(--serif);font-style:italic;font-size:22px;color:var(--line);min-width:30px}
.vb-step .w{flex:1;min-width:0}
.vb-step .w b{display:block;font-weight:400;font-size:13px;letter-spacing:.2em;text-transform:uppercase}
.vb-step .w span{display:block;font-family:var(--serif);font-size:20px;line-height:1.25;margin-top:4px;color:rgba(243,235,224,.9)}
.vb-step.ok .w span{color:rgba(243,235,224,.5);text-decoration:line-through;text-decoration-color:var(--violet-2)}
.vb-step .body{padding:0 0 22px 48px;display:flex;flex-direction:column;gap:14px}
.st{font-size:10px;letter-spacing:.28em;text-transform:uppercase;padding:6px 12px;border-radius:999px;border:1px solid rgba(255,194,102,.5);color:var(--warn);white-space:nowrap;align-self:center}
.st.ok{border-color:rgba(70,224,160,.55);color:var(--ok)}

/* Cases à cocher */
.vb-check{display:flex;align-items:center;gap:18px;padding:15px 0;border-top:1px solid rgba(207,174,120,.25);cursor:pointer}
.vb-check:last-child{border-bottom:1px solid rgba(207,174,120,.25)}
.box{appearance:none;-webkit-appearance:none;width:24px;height:24px;flex:none;margin:0;border:1px solid var(--line);transform:rotate(45deg) scale(.82);background:transparent;display:grid;place-items:center;transition:background .3s ease}
.box:checked{background:linear-gradient(135deg,var(--blue),var(--violet-2));border-color:transparent}
.box:checked::after{content:"";width:6px;height:6px;background:var(--cream)}
.vb-check .t{font-size:13px;letter-spacing:.16em;text-transform:uppercase}
.vb-check.done .t{color:rgba(243,235,224,.45);text-decoration:line-through;text-decoration-color:var(--violet-2)}

/* Champs */
.vb-label{display:flex;flex-direction:column;gap:8px;font-size:10.5px;letter-spacing:.26em;text-transform:uppercase;color:rgba(243,235,224,.62)}
.vb-input{width:100%;background:rgba(11,9,9,.5);border:1px solid rgba(207,174,120,.4);border-radius:14px;padding:13px 16px;font:300 16px var(--sans);letter-spacing:.02em;color:var(--cream);text-transform:none;backdrop-filter:blur(8px)}
textarea.vb-input{min-height:84px;resize:vertical}
.vb-field{display:flex;align-items:center;padding:5px 5px 5px 22px;border:1px solid rgba(207,174,120,.55);border-radius:999px;background:rgba(11,9,9,.45);backdrop-filter:blur(10px)}
.vb-field input{flex:1;min-width:0;background:transparent;border:0;outline:0;font:300 16px var(--sans);padding:11px 0;color:var(--cream)}
.vb-field input::placeholder{color:rgba(243,235,224,.55)}
.vb-field button{flex:none;border:0;cursor:pointer;border-radius:999px;padding:0 22px;height:44px;background:var(--cream);color:var(--deep);font-size:11px;font-weight:500;letter-spacing:.24em;text-transform:uppercase}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}

/* Boutons */
.vb-btns{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.vb-btn{display:inline-flex;align-items:center;justify-content:center;gap:12px;min-height:54px;padding:0 32px;border-radius:999px;cursor:pointer;border:1px solid var(--line);
  background:linear-gradient(135deg,var(--violet-2),var(--deep));color:var(--cream);font-size:11.5px;font-weight:500;letter-spacing:.26em;text-transform:uppercase;
  box-shadow:0 18px 50px rgba(90,15,30,.35);transition:transform .3s ease,box-shadow .3s ease}
.vb-btn:hover{transform:translateY(-2px);box-shadow:0 22px 60px rgba(90,15,30,.55)}
.vb-btn--ghost{background:transparent;box-shadow:none}
.vb-btn--ghost:hover{background:rgba(207,174,120,.12);box-shadow:none}
.vb-btn--ok{border-color:rgba(70,224,160,.6);background:rgba(70,224,160,.1);box-shadow:none;color:var(--ok)}
.vb-btn--sm{min-height:44px;padding:0 22px;font-size:10.5px}
.vb-upl{position:relative;overflow:hidden}
.vb-upl input{position:absolute;inset:0;opacity:0;cursor:pointer}
.vb-note{margin-top:24px;font-size:11px;letter-spacing:.26em;text-transform:uppercase;color:rgba(243,235,224,.6)}
.proofs{display:flex;gap:10px;flex-wrap:wrap}
.proofs img{width:76px;height:96px;object-fit:cover;border-radius:38px 38px 8px 8px;border:1px solid rgba(207,174,120,.45)}

/* Citation, conseil */
.vb-quote{font-family:var(--serif);font-style:italic;font-size:clamp(22px,2.2vw,28px);color:var(--light);margin:0 0 22px;max-width:640px;line-height:1.35;text-wrap:balance}
.vb-soon{max-width:560px;padding:24px 28px;margin:0 0 30px;border-left:1px solid var(--line);font-family:var(--serif);font-style:italic;font-size:23px;line-height:1.35;color:var(--light);background:linear-gradient(90deg,rgba(11,9,9,.55),rgba(11,9,9,0))}
.vb-soon small{display:block;font-family:var(--sans);font-style:normal;font-size:10.5px;letter-spacing:.3em;text-transform:uppercase;color:var(--line);margin-bottom:10px}

/* Planning */
.vb-days{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:0 0 26px;padding:2px}
.vb-days::-webkit-scrollbar{display:none}
.vb-days button{flex:1 0 64px;padding:12px 0;border-radius:999px;border:1px solid rgba(207,174,120,.45);background:rgba(11,9,9,.45);backdrop-filter:blur(6px);cursor:pointer;font-size:11px;letter-spacing:.22em;text-transform:uppercase}
.vb-days button.on{background:var(--cream);color:var(--deep);border-color:var(--cream)}
.vb-slot{display:grid;grid-template-columns:70px 1fr;gap:18px;padding:16px 0;border-top:1px solid rgba(207,174,120,.22);align-items:baseline}
.vb-slot:last-child{border-bottom:1px solid rgba(207,174,120,.22)}
.vb-slot .h{font-family:var(--mono);font-size:12px;color:var(--light);font-variant-numeric:tabular-nums}
.vb-slot .h small{display:block;color:rgba(243,235,224,.45)}
.vb-slot .d{font-family:var(--serif);font-size:20px;line-height:1.25}
.vb-slot .d small{display:block;font-family:var(--sans);font-size:10px;letter-spacing:.28em;text-transform:uppercase;margin-bottom:4px}
.vb-slot.cur{background:linear-gradient(90deg,rgba(122,26,44,.22),transparent);border-radius:10px}

/* Cartes en arche */
.vb-offers{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:22px;max-width:1000px}
.vb-offer{display:flex;flex-direction:column;padding:50px 34px 34px;border-radius:240px 240px 16px 16px;border:1px solid rgba(207,174,120,.45);background:rgba(11,9,9,.62);backdrop-filter:blur(12px);min-width:0}
.vb-offer--featured{background:linear-gradient(180deg,rgba(90,15,30,.88),rgba(90,15,30,.92));border-color:var(--light);box-shadow:0 40px 90px rgba(90,15,30,.4)}
.vb-offer__badge{align-self:center;margin:16px 0 18px;padding:8px 18px;border:1px solid var(--line);border-radius:999px;font-size:10px;letter-spacing:.3em;text-transform:uppercase;color:var(--light);text-align:center}
.vb-offer__name{text-align:center;font-family:var(--serif);font-weight:500;font-size:clamp(28px,2.6vw,36px);margin:0 0 6px;line-height:1.05}
.vb-offer__big{text-align:center;font-family:var(--serif);font-weight:500;font-size:clamp(48px,6vw,68px);line-height:1;margin:6px 0 8px;font-variant-numeric:lining-nums tabular-nums}
.vb-offer__tag{text-align:center;font-family:var(--serif);font-style:italic;font-size:19px;color:var(--light);margin-bottom:22px}
.vb-offer__text{font-size:15px;line-height:1.7;color:rgba(243,235,224,.88)}
.vb-offer__list{list-style:none;margin:0 0 6px;padding:18px 0 0;border-top:1px solid rgba(207,174,120,.3)}
.vb-offer__list li{display:flex;gap:14px;align-items:baseline;justify-content:space-between;padding:7px 0;font-size:14.5px;letter-spacing:.03em}
.vb-offer__list li span:first-child{display:flex;gap:12px;align-items:baseline}
.vb-offer__list li span:first-child::before{content:"";flex:0 0 6px;height:6px;transform:rotate(45deg) translateY(-2px);background:var(--line)}
.vb-offer__list li b{font-weight:400;font-family:var(--mono);font-size:13px;font-variant-numeric:tabular-nums}
.vb-meter{height:2px;background:rgba(243,235,224,.2);margin:14px 0 6px;border-radius:2px;overflow:hidden}
.vb-meter i{display:block;height:100%;background:linear-gradient(90deg,var(--blue),var(--light))}
.vb-seg{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 26px}
.vb-seg button{padding:10px 20px;border-radius:999px;border:1px solid rgba(207,174,120,.45);background:rgba(11,9,9,.4);cursor:pointer;font-size:10.5px;letter-spacing:.24em;text-transform:uppercase}
.vb-seg button.on{background:var(--cream);color:var(--deep);border-color:var(--cream)}
.vb-ent{display:flex;align-items:baseline;gap:14px;padding:14px 0;border-top:1px solid rgba(207,174,120,.22)}
.vb-ent .l{flex:1;min-width:0}

const sensei = (off=0)=>{const d=new Date(),doy=Math.floor((d-new Date(d.getFullYear(),0,0))/864e5);return ANIME[(doy+off)%ANIME.length];};
function senseiCard(a,i){return `<article class="vb-sensei vb-anim" style="--i:${i}">

/* ===================== Utilitaires ===================== */
const $ = (s,r=document)=>r.querySelector(s);
const pad = n=>String(n).padStart(2,"0");
const keyOf = d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const fromKey = k=>{const [y,m,d]=k.split("-").map(Number);return new Date(y,m-1,d);};
const esc = s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const eur = n=>(Math.round(n*100)/100).toLocaleString("fr-FR",{maximumFractionDigits:2})+" €";
const mins = t=>{const [h,m]=t.split(":").map(Number);return h*60+m;};
const uid = ()=>Math.random().toString(36).slice(2,10);
let toastT;
function toast(m){const t=$("#toast");t.textContent=m;t.classList.add("is-on");clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove("is-on"),1900);}

/* ===================== Stockage ===================== */
const S={days:{},settings:{missions:{}},base:null,assets:null};
function lsGet(k,f){try{const v=localStorage.getItem(k);return v?JSON.parse(v):f;}catch(e){return f;}}
function lsSet(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}
S.days=lsGet("vie.days",{});S.settings=lsGet("vie.settings",{missions:{}});
function day(k){const d=S.days[k]||(S.days[k]={});d.done||={};d.habits||={};d.notes||={};d.proofs||={};d.missions||={};d.money||=[];d.clients||=0;return d;}
const timers={};
function saveDay(k){
  lsSet("vie.days",S.days);
  if(!S.base) return;
  clearTimeout(timers[k]);
  timers[k]=setTimeout(async()=>{try{await S.base.days.doc(k).set(JSON.parse(JSON.stringify(S.days[k])));}catch(e){toast("Pas enregistré en ligne");}},600);
}
async function saveSettings(){lsSet("vie.settings",S.settings);if(S.base){try{await S.base.settings.set(S.settings);}catch(e){}}}
const editing=()=>{const a=document.activeElement;return a&&/INPUT|TEXTAREA|SELECT/.test(a.tagName)&&a.type!=="checkbox";};
async function connect(){
  if(!window.claude?.use) return;
  try{
    const [db,user,assets]=await Promise.all([claude.use("db"),claude.use("user"),claude.use("assets")]);
    S.assets=assets;
    if(!db||!user) return;
    const id=await user.id();
    S.base={days:db.collection("data/users/"+id+"/vie/days"),settings:db.doc("data/users/"+id+"/settings")};
    const sy=$("#sync");sy.classList.add("on");sy.lastChild.textContent="Synchro";
    let first=true;
    S.base.days.onSnapshot(snap=>{
      const remote={};snap.docs.forEach(d=>{remote[d.id]=JSON.parse(JSON.stringify(d.data()));});
      if(first){const local=lsGet("vie.days",{});Object.keys(local).forEach(k=>{if(!remote[k]){remote[k]=local[k];S.days[k]=local[k];saveDay(k);}});first=false;}
      S.days=remote;lsSet("vie.days",S.days);
      if(!editing()) renderAll(true);
    },()=>{});
    S.base.settings.onSnapshot(s=>{if(s.exists){S.settings=JSON.parse(JSON.stringify(s.data()));S.settings.missions||={};lsSet("vie.settings",S.settings);if(!editing()) renderAll(true);}},()=>{});
  }catch(e){}
}

/* ===================== Logique ===================== */
const todayKey=()=>keyOf(new Date());
const missionOf=(k,p)=>day(k).missions[p]||S.settings.missions[p]||PROJECTS.find(x=>x.k===p).def;
const habitsFor=k=>{const d=fromKey(k).getDay();return HABITS.filter(h=>!h.sunday||d===0);};
function progress(k){const d=day(k),hs=habitsFor(k),t=PROJECTS.length+hs.length,n=PROJECTS.filter(p=>d.done[p.k]).length+hs.filter(h=>d.habits[h.k]).length;return{n,t,pct:Math.round(n/t*100)};}
function streak(){let n=0;const d=new Date();const full=k=>{const x=S.days[k];return x&&x.done&&PROJECTS.every(p=>x.done[p.k]);};if(!full(keyOf(d)))d.setDate(d.getDate()-1);while(full(keyOf(d))){n++;d.setDate(d.getDate()-1);}return n;}
function allMoney(){const o=[];Object.entries(S.days).forEach(([k,d])=>(d.money||[]).forEach(m=>o.push({...m,date:k})));return o.sort((a,b)=>b.date.localeCompare(a.date));}
function sums(l){const g=l.filter(m=>m.kind==="gain").reduce((a,m)=>a+Number(m.amt||0),0),s=l.filter(m=>m.kind==="depense").reduce((a,m)=>a+Number(m.amt||0),0);return{g,s,save:g*.8,spend:g*.2,left:g*.2-s};}
function lastN(n){const set=new Set(),d=new Date();for(let i=0;i<n;i++){set.add(keyOf(d));d.setDate(d.getDate()-1);}return set;}
function nowMin(){const n=new Date();return n.getHours()*60+n.getMinutes();}
function curSlot(plan){const m=nowMin();return plan.find(s=>m>=mins(s[0])&&m<mins(s[1]))||plan.find(s=>mins(s[0])>m)||null;}
function tip(off=0){const d=new Date(),doy=Math.floor((d-new Date(d.getFullYear(),0,0))/864e5);return TIPS[(doy+off)%TIPS.length];}

const A=(i)=>`class="vb-anim" style="--i:${i}"`;

    <div class="t">${cur?`${isNow?"En ce moment":"Prochain"} · ${cur[0]} – ${cur[1]}<strong>${esc(cur[3])}</strong>`:`Journée terminée<strong>Douche, lecture, au lit avant 1 h.</strong>`}

  <div class="vb-closing vb-anim" style="--i:12"><p>Une mission à la fois.<br><em>Une victoire chaque jour.</em></p></div>`;
}

function mission(k,p,i){

  return `<li class="vb-step ${ok?"ok":""}"><details data-p="${p.k}">
    <summary class="row" style="display:flex;align-items:baseline;gap:18px;padding:18px 0;cursor:pointer;list-style:none"><span class="n">${i+1}</span><span class="w"><b>${esc(p.n)}</b><span>${esc(missionOf(k,p.k))}</span></span><span class="st ${ok?"ok":""}">${ok?"Validé":"À faire"}</span></summary>
    <div class="body">
      <label class="vb-label">Mission du jour<input class="vb-input" type="text" id="mis-${p.k}" data-act="mission" data-p="${p.k}" value="${esc(missionOf(k,p.k))}"></label>
      ${p.k==="vente"?`<div class="grid2"><label class="vb-label">Clients traités<input class="vb-input" type="number" inputmode="numeric" min="0" id="cli" data-act="clients" value="${d.clients||0}"></label>

        <div class="vb-field"><input type="number" inputmode="decimal" id="venteAmt" placeholder="Montant d'une vente (€)"><button type="button" data-act="addVente">Ajouter</button></div>`:""}

      ${proofs.length?`<div class="proofs">${proofs.map(s=>`<img src="${esc(s)}" alt="Preuve ${esc(p.n)}">`).join("")}</div>`:""}
      <div class="vb-btns">
        <span class="vb-btn vb-btn--ghost vb-btn--sm vb-upl">Photo preuve<input type="file" accept="image/*" id="proof-${p.k}" data-act="proof" data-p="${p.k}"></span>

}

  </div>

  <h3 class="vb-h3 vb-anim" style="--i:7">Historique</h3>
  <div class="vb-anim" style="--i:8;max-width:720px">${list.length?list.slice(0,40).map(m=>{const dt=fromKey(m.date);return `<div class="vb-ent"><div class="l"><b>${esc(m.kind==="gain"?(m.src||"Gain"):"Dépense")}</b><small>${dt.getDate()} ${MONTHN[dt.getMonth()]}${m.label?" · "+esc(m.label):""}</small></div><span class="a ${m.kind==="gain"?"p":"m"}">${m.kind==="gain"?"+":"−"}${eur(Number(m.amt))}</span><button class="vb-x" aria-label="Supprimer" data-act="delMoney" data-date="${m.date}" data-id="${m.id}">×</button></div>`;}).join(""):`<div class="vb-soon" style="font-size:20px">Rien sur cette période. Ta première coupe ou vente notée apparaîtra ici.</div>`}</div>
  <div class="vb-note vb-anim" style="--i:9">Depuis le début : ${eur(tot.g)} gagnés · ${eur(tot.save)} à l'épargne</div>`;
}

function pConseils(){
  const t=[tip(),tip(7),tip(15)];
  return `
  <div class="vb-kicker vb-anim" style="--i:0"><em>v.</em>Conseils</div>
  <h2 class="vb-title vb-anim" style="--i:1">Sagesse. Respect.<em>Réussite.</em></h2>
  <div id="senseiBox">${senseiCard(dojoPick!=null?ANIME[dojoPick]:sensei(),2)}</div>

  <p class="vb-sub vb-anim" style="--i:3">20 leçons · un nouveau sensei chaque jour · touche-en un pour le relire</p>
  <div class="vb-dojo vb-anim" style="--i:4">${ANIME.map((a,i)=>`<button type="button" data-sensei="${i}" class="${(dojoPick!=null?ANIME[dojoPick]:sensei())===a?"on":""}"><img src="img/${a[0]}.jpg" alt="" loading="lazy"><b>${esc(a[1])}</b><small>${esc(a[3])}</small></button>`).join("")}</div>
  <h3 class="vb-h3 vb-anim" style="--i:5">Conseils <em>pratiques</em></h3>
  ${t.map((x,i)=>`<div class="vb-soon vb-anim" style="--i:${5+i}"><small>${esc(x[0])}</small>${esc(x[1])}</div>`).join("")}
  <h3 class="vb-h3 vb-anim" style="--i:5">Mes <em>règles</em></h3>
  <ol class="vb-steps vb-anim" style="--i:6">${["Dormir avant 1 h, 2 h grand max. Debout à 8 h, 10 h maximum.","Douche le matin et le soir. Le dimanche soir : skincare et coiffure.","Chambre propre avant de sortir.","Une séance de muscu et 15 à 30 min de lecture chaque jour.","Une mission par projet chaque jour, validée avant de dormir.","80 % épargnés, 20 % dépensés.","No drug. No girl. Lock-in pendant un an."].map((r,i)=>`<li class="vb-step"><div class="row"><span class="n">${i+1}</span><span class="w"><span style="margin-top:0">${r}</span></span></div></li>`).join("")}</ol>
  <h3 class="vb-h3 vb-anim" style="--i:7">Bien <em>manger</em></h3>
  <p class="vb-sub vb-anim" style="--i:7">Une protéine, un féculent, des légumes à chaque repas</p>
  <div class="vb-offers vb-anim" style="--i:8">${RECIPES.map((r,i)=>`<article class="vb-offer${i===0?" vb-offer--featured":""}"><div class="vb-offer__badge">${ROMAN[i]} Recette</div><h4 class="vb-offer__name">${esc(r[0])}</h4><div class="vb-offer__tag">${esc(r[1])}</div><div class="vb-offer__text">${esc(r[2])}</div></article>`).join("")}</div>
  <div class="vb-closing vb-anim" style="--i:9"><p>Sagesse, paix, respect, intelligence,<br><em>amusement, challenge, réussite.</em></p>
    <div class="vb-words"><span class="no">No drug</span><span class="no">No girl</span><span>Lock-in</span></div></div>`;
}

const PANELS={jour:pJour,semaine:pSemaine,projets:pProjets,argent:pArgent,conseils:pConseils};
const TABS=Object.keys(PANELS);
let current="jour";
function renderPanel(t,keepOpen){
  const el=$(`[data-vb-panel="${t}"] .vb-panel__content`);
  const open=keepOpen?[...el.querySelectorAll("details[open]")].map(d=>d.dataset.p||d.querySelector(".w b")?.textContent):[];
  el.innerHTML=PANELS[t]();
  open.forEach(o=>{[...el.querySelectorAll("details")].find(d=>(d.dataset.p||d.querySelector(".w b")?.textContent)===o)?.setAttribute("open","");});
}
function renderAll(keep){TABS.forEach(t=>renderPanel(t,keep));}

/* ===================== Navigation (même mécanique que V Barber) ===================== */
const root=$("#vb");
function moveBar(){
  const btn=$(`.vb-tab[data-vb-go="${current}"]`),bar=$(".vb-tabs__bar"),nav=$(".vb-tabs");
  if(!btn) return;const a=btn.getBoundingClientRect(),b=nav.getBoundingClientRect();
  bar.style.width=Math.max(0,a.width-24)+"px";bar.style.transform=`translateX(${a.left-b.left+12}px)`;
}
function go(t){
  if(!PANELS[t]) return;
  current=t;
  document.querySelectorAll(".vb-tab").forEach(b=>b.setAttribute("aria-selected",b.dataset.vbGo===t?"true":"false"));
  document.querySelectorAll(".vb-panel").forEach(p=>{const on=p.dataset.vbPanel===t;p.classList.toggle("is-active",on);if(on)p.scrollTop=0;});
  if(root.classList.contains("vb--site")) scene.to(TABS.indexOf(t)+1);
  moveBar();
}
function enter(){root.classList.add("vb--site");try{sessionStorage.setItem("vie.entered","1");}catch(e){}go(current);}
window.addEventListener("resize",moveBar);

/* ===================== Fond : tes photos en fondu (comme le diaporama V Barber) ===================== */
const SETS=[
  (()=>{const v=[...Array(15)].map((_,i)=>"vf"+String(i+1).padStart(2,"0"));const d=new Date(),o=Math.floor((d-new Date(d.getFullYear(),0,0))/864e5)%15;return v.slice(o).concat(v.slice(0,o));})(),
  ["jour1","jour2","jour3","intro1","intro4"],
  ["sem1","sem2","con2","intro2","intro3","intro5"],
  ["proj2","proj3","con1","con3"],
  ["arg1","arg2","arg3","arg4"],
  ["a08","a20","a13","a17","a05","a09","a10","a03"]
];
const scene=(()=>{
  const stage=$(".vb-stage"),imgs={};
  function img(n){ if(!imgs[n]){
    if(n.startsWith("vf")){const w=document.createElement("div");w.className="vb-v";w.innerHTML=`<img class="bg" alt="" decoding="async" src="img/${n}.jpg"><img class="fg" alt="" decoding="async" src="img/${n}.jpg">`;stage.appendChild(w);imgs[n]=w;}
    else{const i=document.createElement("img");i.alt="";i.decoding="async";i.src="img/"+n+".jpg";stage.appendChild(i);imgs[n]=i;}
  } return imgs[n]; }
  let set=0,idx=0,timer,shown=null;
  function show(){
    const n=SETS[set][idx%SETS[set].length],el=img(n);
    if(shown&&shown!==el) shown.classList.remove("is-active");
    el.classList.remove("is-active");void el.offsetWidth;el.classList.add("is-active");shown=el;
    const nx=SETS[set][(idx+1)%SETS[set].length];img(nx);
    if(set===0){[...document.querySelectorAll("[data-vb-dots] span")].forEach((d,j)=>{d.classList.remove("is-active");if(j===idx%SETS[0].length){void d.offsetWidth;d.classList.add("is-active");}});}
  }
  function start(){clearInterval(timer);show();if(SETS[set].length>1)timer=setInterval(()=>{idx++;show();},set===0?3000:7000);}
  SETS[0].forEach(img);
  return{to(i){if(i===set&&shown)return;set=i;idx=0;start();},start};
})();
(()=>{const w=$("[data-vb-dots]");SETS[0].forEach(()=>w.appendChild(document.createElement("span")));})();
scene.start();

/* Logo V du jour : un des 15 V, change chaque jour */
(()=>{const d=new Date(),doy=Math.floor((d-new Date(d.getFullYear(),0,0))/864e5),src="img/v"+String(doy%15+1).padStart(2,"0")+".jpg";
  $("#logoHead").src=src;})();

/* ===================== Interactions ===================== */
function reopen(p){$(`[data-vb-panel="${current}"] details[data-p="${p}"]`)?.setAttribute("open","");}
document.addEventListener("click",e=>{
  if(!root.classList.contains("vb--site")&&e.target.closest(".vb-intro")) return enter();
  const t=e.target.closest("[data-vb-enter],[data-vb-go],[data-day],[data-kind],[data-range],[data-sensei],[data-act]");if(!t)return;
  if(t.hasAttribute("data-vb-enter")) return enter();
  if(t.dataset.vbGo){ if(!root.classList.contains("vb--site")) enter(); return go(t.dataset.vbGo); }
  if(t.dataset.day){selDay=Number(t.dataset.day);renderPanel("semaine");return;}
  if(t.dataset.kind){moneyKind=t.dataset.kind;renderPanel("argent");return;}
  if(t.dataset.range){moneyRange=t.dataset.range;renderPanel("argent");return;}
  if(t.dataset.sensei){dojoPick=Number(t.dataset.sensei);renderPanel("conseils");const p=$('[data-vb-panel="conseils"]');p.querySelectorAll(".vb-anim").forEach(e=>e.style.transitionDelay="0s");p.scrollTo({top:0,behavior:"smooth"});return;}
  const k=todayKey(),a=t.dataset.act;
  if(a==="validate"){e.preventDefault();const d=day(k),p=t.dataset.p;d.done[p]=!d.done[p];saveDay(k);renderAll(true);if(!d.done[p])reopen(p);toast(d.done[p]?"Mission validée":"Validation annulée");}
  if(a==="addVente"){const v=Number($("#venteAmt").value);if(!(v>0))return toast("Entre un montant");day(k).money.push({id:uid(),kind:"gain",src:"Vente",amt:v,label:"Vente"});saveDay(k);renderAll(true);toast("+"+eur(v)+" · vente ajoutée");}
  if(a==="addMoney"){const v=Number($("#mAmt").value),dk=$("#mDate").value||k;if(!(v>0))return toast("Entre un montant");
    day(dk).money.push({id:uid(),kind:moneyKind,src:moneyKind==="gain"?$("#mSrc").value:"",amt:v,label:$("#mLbl").value.trim()});saveDay(dk);renderAll(true);toast(moneyKind==="gain"?`+${eur(v)} · ${eur(v*.8)} à épargner`:"Dépense notée");}
  if(a==="delMoney"){const d=day(t.dataset.date);d.money=d.money.filter(m=>m.id!==t.dataset.id);saveDay(t.dataset.date);renderAll(true);}
});
document.addEventListener("change",async e=>{
  const t=e.target,k=todayKey(),a=t.dataset.act;if(!a)return;
  if(a==="habit"){day(k).habits[t.dataset.h]=t.checked;saveDay(k);t.closest(".vb-check").classList.toggle("done",t.checked);const p=progress(k),c=$(".ring .c");if(c){c.style.setProperty("--p",p.pct);c.querySelector("b").textContent=p.pct+"%";}}
  if(a==="proof"&&t.files[0]){
    toast("Envoi de la photo…");
    try{let src;if(S.assets){src=(await S.assets.upload(await shrink(t.files[0],1200,.82))).url;}else{src=await toURL(await shrink(t.files[0],360,.7));}
      const p=t.dataset.p;(day(k).proofs[p]||=[]).push(src);saveDay(k);renderAll(true);reopen(p);toast("Preuve ajoutée");
    }catch(err){toast("Photo non ajoutée, réessaie");}
  }
});
const typing={};
document.addEventListener("input",e=>{
  const t=e.target,k=todayKey(),a=t.dataset.act;if(!a)return;
  clearTimeout(typing[t.id]);
  typing[t.id]=setTimeout(()=>{
    if(a==="note"){day(k).notes[t.dataset.p]=t.value;saveDay(k);}
    if(a==="mission"){day(k).missions[t.dataset.p]=t.value;saveDay(k);const s=t.closest("details")?.querySelector(".w span");if(s)s.textContent=t.value;}
    if(a==="clients"){day(k).clients=Number(t.value)||0;saveDay(k);}
    if(a==="defmission"){S.settings.missions[t.dataset.p]=t.value;saveSettings();}
    if(a==="permis"){S.settings.permis=t.value;saveSettings();}
  },500);
});
function shrink(f,max,q){return new Promise((res,rej)=>{const i=new Image();i.onload=()=>{const s=Math.min(1,max/Math.max(i.width,i.height)),c=document.createElement("canvas");c.width=Math.round(i.width*s);c.height=Math.round(i.height*s);c.getContext("2d").drawImage(i,0,0,c.width,c.height);c.toBlob(b=>b?res(b):rej(),"image/jpeg",q);URL.revokeObjectURL(i.src);};i.onerror=rej;i.src=URL.createObjectURL(f);});}
function toURL(b){return new Promise(r=>{const f=new FileReader();f.onload=()=>r(f.result);f.readAsDataURL(b);});}

try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist();}catch(e){}
renderAll();
let entered=false;try{entered=sessionStorage.getItem("vie.entered")==="1";}catch(e){}
if(entered) enter(); else go("jour");
connect();
/* Rappel dans l'app : 15 minutes avant chaque créneau */
const seen=new Set();let alertKey=null;
function checkAlert(){
  const n=new Date(),m=n.getHours()*60+n.getMinutes(),k=todayKey();
  const nx=PLAN(n.getDay()).find(s=>{const d=mins(s[0])-m;return d>0&&d<=15;});
  if(!nx) return;
  const key=k+nx[0];if(seen.has(key)||alertKey===key) return;
  alertKey=key;const d=mins(nx[0])-m;
  $("#alertWhen").textContent=`Dans ${d} min · ${nx[0]} · ${CAT[nx[2]]}`;$("#alertWhat").textContent=nx[3];
  $("#alert").classList.add("is-on");
  try{navigator.vibrate&&navigator.vibrate([120,60,120]);}catch(e){}
}
$("#alertOk").addEventListener("click",()=>{if(alertKey)seen.add(alertKey);alertKey=null;$("#alert").classList.remove("is-on");});
checkAlert();setInterval(checkAlert,30000);
document.addEventListener("visibilitychange",()=>{if(!document.hidden){checkAlert();if(!editing())renderPanel("jour");}});
setInterval(()=>{if(!editing()&&!document.querySelector(".vb-panel.is-active details[open]")){renderPanel("jour");}},60000);
</script>
